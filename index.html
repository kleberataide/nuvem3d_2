<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GOES-19 HT — Visualização 3D com Mapa de Fundo (Three.js + WebGL)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #070b14;
      color: #f8fafc;
      overflow: hidden;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
    }
    .hud {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      width: 330px;
      background: rgba(15, 23, 42, 0.90);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
    }
    .hud h1 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .hud p {
      font-size: 12px;
      color: #cbd5e1;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .control {
      margin-bottom: 12px;
    }
    .control label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 4px;
    }
    .control input[type="range"],
    .control input[type="file"],
    .control select {
      width: 100%;
    }
    .control select {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 12px;
    }
    .colorbar {
      height: 10px;
      border-radius: 5px;
      background: linear-gradient(90deg, #2563eb, #06b6d4, #22c55e, #eab308, #ef4444);
      margin-top: 4px;
    }
    .scale-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #cbd5e1;
      margin-top: 3px;
    }
    .info {
      margin-top: 10px;
      font-size: 11px;
      color: #93c5fd;
      line-height: 1.4;
    }
    .selected-box {
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.45);
      font-size: 12px;
      line-height: 1.45;
      display: none;
    }
    .selected-box strong {
      color: #38bdf8;
    }
    .click-popup {
      position: fixed;
      z-index: 20;
      pointer-events: none;
      background: rgba(2, 6, 23, 0.94);
      border: 1px solid #38bdf8;
      color: #f8fafc;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.45;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      display: none;
      transform: translate(12px, -12px);
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="hud">
    <h1>GOES-19 HT — Topo de Nuvens (3D)</h1>
    <p>Clique em um ponto para ver a altura | Arraste para girar | Scroll: zoom</p>

    <div class="control">
      <label for="fileInput"><span>Carregar GeoJSON local</span></label>
      <input id="fileInput" type="file" accept=".geojson,.json" />
    </div>

    <div class="control">
      <label for="basemapSelect"><span>Mapa base (tiles Web Mercator)</span></label>
      <select id="basemapSelect">
        <option value="carto-dark" selected>CartoDB Dark Matter</option>
        <option value="osm">OpenStreetMap Padrão</option>
        <option value="esri-sat">Esri World Imagery (Satélite)</option>
      </select>
    </div>

    <div class="control">
      <label for="exagInput">
        <span>Exagero vertical</span>
        <span id="exagLabel">0.01x</span>
      </label>
      <input id="exagInput" type="range" min="0.001" max="0.05" step="0.001" value="0.01" />
    </div>

    <div class="control">
      <label for="sizeInput">
        <span>Tamanho das partículas</span>
        <span id="sizeLabel">0.22</span>
      </label>
      <input id="sizeInput" type="range" min="0.05" max="0.80" step="0.01" value="0.22" />
    </div>

    <div>
      <span style="font-size:11px;">Altura do topo de nuvens (km)</span>
      <div class="colorbar"></div>
      <div class="scale-labels">
        <span>0 km</span>
        <span>5 km</span>
        <span>10 km</span>
        <span>15+ km</span>
      </div>
    </div>

    <div id="selectedBox" class="selected-box"></div>
    <div id="info" class="info">Carregando mapa 3D e GOES19_HT_Brasil_3D.geojson...</div>
  </div>

  <div id="clickPopup" class="click-popup"></div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const LON_MIN = -74.5;
    const LON_MAX = -34.0;
    const LAT_MIN = -34.0;
    const LAT_MAX = 5.5;

    // Projeção Web Mercator (EPSG:3857) para alinhar perfeitamente os tiles Leaflet/OSM com os pontos 3D
    const EARTH_R = 6378137.0;
    function lonToMercX(lon) {
      return (lon * Math.PI / 180) * EARTH_R;
    }
    function latToMercY(lat) {
      const clamped = Math.max(-85.05112878, Math.min(85.05112878, lat));
      const rad = clamped * Math.PI / 180;
      return Math.log(Math.tan(Math.PI / 4 + rad / 2)) * EARTH_R;
    }

    const MERC_X_MIN = lonToMercX(LON_MIN);
    const MERC_X_MAX = lonToMercX(LON_MAX);
    const MERC_Y_MIN = latToMercY(LAT_MIN);
    const MERC_Y_MAX = latToMercY(LAT_MAX);

    const MERC_CENTER_X = (MERC_X_MIN + MERC_X_MAX) * 0.5;
    const MERC_CENTER_Y = (MERC_Y_MIN + MERC_Y_MAX) * 0.5;

    // 1 unidade da cena = 100 km em Mercator (cena ~ 45 x 46 unidades)
    const METERS_TO_SCENE = 1 / 100000;
    const SCENE_WIDTH = (MERC_X_MAX - MERC_X_MIN) * METERS_TO_SCENE;
    const SCENE_DEPTH = (MERC_Y_MAX - MERC_Y_MIN) * METERS_TO_SCENE;

    function geoToSceneXZ(lon, lat) {
      const mx = lonToMercX(lon);
      const my = latToMercY(lat);
      const x = (mx - MERC_CENTER_X) * METERS_TO_SCENE;
      const z = -(my - MERC_CENTER_Y) * METERS_TO_SCENE; // Norte para -Z
      return { x, z };
    }

    const container = document.getElementById("canvas-container");
    const infoEl = document.getElementById("info");
    const selectedBoxEl = document.getElementById("selectedBox");
    const clickPopupEl = document.getElementById("clickPopup");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070b14);

    const camera = new THREE.PerspectiveCamera(
      48,
      window.innerWidth / window.innerHeight,
      0.1,
      2000
    );
    camera.position.set(0, 32, 42);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;

    // Grupo do mapa base em 3D (plano y = 0 texturizado com tiles estilo Leaflet)
    const mapGroup = new THREE.Group();
    scene.add(mapGroup);

    const BASEMAPS = {
      "carto-dark": (z, x, y) => `https://a.basemaps.cartocdn.com/dark_all/${z}/${x}/${y}.png`,
      "osm": (z, x, y) => `https://tile.openstreetmap.org/${z}/${x}/${y}.png`,
      "esri-sat": (z, x, y) => `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`
    };

    function lon2tile(lon, zoom) {
      return Math.floor(((lon + 180) / 360) * Math.pow(2, zoom));
    }
    function lat2tile(lat, zoom) {
      const rad = lat * Math.PI / 180;
      return Math.floor(
        ((1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2) * Math.pow(2, zoom)
      );
    }
    function tile2lon(x, zoom) {
      return (x / Math.pow(2, zoom)) * 360 - 180;
    }
    function tile2lat(y, zoom) {
      const n = Math.PI - (2 * Math.PI * y) / Math.pow(2, zoom);
      return (180 / Math.PI) * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
    }

    function buildBasemap3D(styleKey = "carto-dark") {
      while (mapGroup.children.length > 0) {
        const child = mapGroup.children.pop();
        if (child.geometry) child.geometry.dispose();
        if (child.material) {
          if (child.material.map) child.material.map.dispose();
          child.material.dispose();
        }
      }

      const zoom = 5; // Zoom 5 cobre o Brasil com alta nitidez (~100 tiles)
      const xMin = lon2tile(LON_MIN, zoom);
      const xMax = lon2tile(LON_MAX, zoom);
      const yMin = lat2tile(LAT_MAX, zoom);
      const yMax = lat2tile(LAT_MIN, zoom);

      const loader = new THREE.TextureLoader();
      loader.setCrossOrigin("anonymous");
      const urlBuilder = BASEMAPS[styleKey] || BASEMAPS["carto-dark"];

      for (let tx = xMin; tx <= xMax; tx++) {
        for (let ty = yMin; ty <= yMax; ty++) {
          const wLon = tile2lon(tx, zoom);
          const eLon = tile2lon(tx + 1, zoom);
          const nLat = tile2lat(ty, zoom);
          const sLat = tile2lat(ty + 1, zoom);

          const nw = geoToSceneXZ(wLon, nLat);
          const se = geoToSceneXZ(eLon, sLat);

          const tileW = Math.abs(se.x - nw.x);
          const tileD = Math.abs(se.z - nw.z);
          const centerX = (nw.x + se.x) * 0.5;
          const centerZ = (nw.z + se.z) * 0.5;

          const geo = new THREE.PlaneGeometry(tileW, tileD);
          geo.rotateX(-Math.PI / 2);

          const mat = new THREE.MeshBasicMaterial({
            color: 0xffffff,
            side: THREE.DoubleSide
          });

          loader.load(
            urlBuilder(zoom, tx, ty),
            tex => {
              tex.colorSpace = THREE.SRGBColorSpace;
              tex.anisotropy = 4;
              mat.map = tex;
              mat.needsUpdate = true;
            },
            undefined,
            () => {
              mat.color.setHex(0x1e293b);
            }
          );

          const mesh = new THREE.Mesh(geo, mat);
          mesh.position.set(centerX, 0, centerZ);
          mapGroup.add(mesh);
        }
      }

      // Moldura da área recortada do Brasil sobre o mapa
      const borderGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(SCENE_WIDTH, 0.04, SCENE_DEPTH));
      const borderMat = new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.7 });
      const borderBox = new THREE.LineSegments(borderGeo, borderMat);
      borderBox.position.y = 0.02;
      mapGroup.add(borderBox);
    }

    buildBasemap3D("carto-dark");

    // Marcador visual para o ponto clicado
    const markerGeo = new THREE.SphereGeometry(0.28, 16, 16);
    const markerMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const selectedMarker = new THREE.Mesh(markerGeo, markerMat);
    selectedMarker.visible = false;
    scene.add(selectedMarker);

    const stemGeo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(0, 1, 0)
    ]);
    const stemMat = new THREE.LineBasicMaterial({ color: 0xffffff });
    const selectedStem = new THREE.Line(stemGeo, stemMat);
    selectedStem.visible = false;
    scene.add(selectedStem);

    let cloudPoints = null;
    let rawPoints = []; // { x, z, lon, lat, htMeters }
    let elevationExag = 0.01;
    let pointSize = 0.22;
    let selectedIndex = -1;

    function heightToRGB(htMeters) {
      const t = Math.max(0, Math.min(1, htMeters / 16000));
      const stops = [
        [0.145, 0.388, 0.922],
        [0.024, 0.714, 0.831],
        [0.133, 0.773, 0.369],
        [0.918, 0.702, 0.031],
        [0.937, 0.267, 0.267]
      ];
      const scaled = t * (stops.length - 1);
      const idx = Math.min(stops.length - 2, Math.floor(scaled));
      const localT = scaled - idx;
      const c0 = stops[idx];
      const c1 = stops[idx + 1];
      return [
        c0[0] + (c1[0] - c0[0]) * localT,
        c0[1] + (c1[1] - c0[1]) * localT,
        c0[2] + (c1[2] - c0[2]) * localT
      ];
    }

    function updateSelectionVisual() {
      if (selectedIndex < 0 || selectedIndex >= rawPoints.length) {
        selectedMarker.visible = false;
        selectedStem.visible = false;
        return;
      }
      const pt = rawPoints[selectedIndex];
      const y = Math.max(0, pt.htMeters * elevationExag);
      selectedMarker.position.set(pt.x, y, pt.z);
      selectedMarker.visible = true;

      const posAttr = selectedStem.geometry.attributes.position;
      posAttr.setXYZ(0, pt.x, 0, pt.z);
      posAttr.setXYZ(1, pt.x, y, pt.z);
      posAttr.needsUpdate = true;
      selectedStem.visible = true;
    }

    function rebuildCloud() {
      if (cloudPoints) {
        scene.remove(cloudPoints);
        cloudPoints.geometry.dispose();
        cloudPoints.material.dispose();
        cloudPoints = null;
      }
      if (!rawPoints.length) return;

      const positions = new Float32Array(rawPoints.length * 3);
      const colors = new Float32Array(rawPoints.length * 3);

      for (let i = 0; i < rawPoints.length; i++) {
        const pt = rawPoints[i];
        positions[i * 3] = pt.x;
        positions[i * 3 + 1] = Math.max(0, pt.htMeters * elevationExag);
        positions[i * 3 + 2] = pt.z;

        const [r, g, b] = heightToRGB(pt.htMeters);
        colors[i * 3] = r;
        colors[i * 3 + 1] = g;
        colors[i * 3 + 2] = b;
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));
      geometry.computeBoundingSphere();

      const material = new THREE.PointsMaterial({
        size: pointSize,
        vertexColors: true,
        transparent: true,
        opacity: 0.94
      });

      cloudPoints = new THREE.Points(geometry, material);
      scene.add(cloudPoints);
      updateSelectionVisual();
    }

    function parseGeoJson(geojson) {
      const features = Array.isArray(geojson.features) ? geojson.features : [];
      const parsed = [];

      for (const feat of features) {
        if (!feat.geometry || feat.geometry.type !== "Point") continue;
        const coords = feat.geometry.coordinates;
        if (!Array.isArray(coords) || coords.length < 2) continue;

        const lon = Number(coords[0]);
        const lat = Number(coords[1]);
        const htMeters = Number(feat.properties?.ht_m ?? coords[2] ?? 0);

        if (!Number.isFinite(lon) || !Number.isFinite(lat) || !Number.isFinite(htMeters)) continue;

        const { x, z } = geoToSceneXZ(lon, lat);
        parsed.push({ x, z, lon, lat, htMeters });
      }

      rawPoints = parsed;
      selectedIndex = -1;
      selectedBoxEl.style.display = "none";
      clickPopupEl.style.display = "none";
      rebuildCloud();
      infoEl.textContent = `Pontos 3D carregados: ${rawPoints.length.toLocaleString("pt-BR")}`;
    }

    // Raycaster para selecionar ponto ao clicar
    const raycaster = new THREE.Raycaster();
    raycaster.params.Points.threshold = 0.35;
    const pointer = new THREE.Vector2();
    let downPos = { x: 0, y: 0 };

    renderer.domElement.addEventListener("pointerdown", e => {
      downPos = { x: e.clientX, y: e.clientY };
    });

    renderer.domElement.addEventListener("pointerup", e => {
      const dist = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
      if (dist > 5 || !cloudPoints) return; // Ignora arraste da câmera

      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.params.Points.threshold = Math.max(0.25, pointSize * 1.4);
      raycaster.setFromCamera(pointer, camera);

      const hits = raycaster.intersectObject(cloudPoints);
      if (hits.length > 0 && hits[0].index !== undefined) {
        selectedIndex = hits[0].index;
        const pt = rawPoints[selectedIndex];
        const htKm = (pt.htMeters / 1000).toFixed(2);

        updateSelectionVisual();

        const htmlInfo = `
          <strong>Ponto selecionado</strong><br/>
          Altura (HT): <strong>${pt.htMeters.toFixed(1)} m</strong> (${htKm} km)<br/>
          Lat: ${pt.lat.toFixed(4)}° | Lon: ${pt.lon.toFixed(4)}°
        `;
        selectedBoxEl.innerHTML = htmlInfo;
        selectedBoxEl.style.display = "block";

        clickPopupEl.innerHTML = htmlInfo;
        clickPopupEl.style.left = `${e.clientX}px`;
        clickPopupEl.style.top = `${e.clientY}px`;
        clickPopupEl.style.display = "block";
      }
    });

    fetch("./GOES19_HT_Brasil_3D.geojson")
      .then(res => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      })
      .then(data => parseGeoJson(data))
      .catch(() => {
        infoEl.textContent = "Carregue o arquivo .geojson pelo botão acima ou acesse via servidor HTTP/GitHub Pages.";
      });

    document.getElementById("fileInput").addEventListener("change", event => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          parseGeoJson(JSON.parse(e.target.result));
        } catch {
          infoEl.textContent = "Falha ao interpretar o arquivo GeoJSON.";
        }
      };
      reader.readAsText(file);
    });

    document.getElementById("basemapSelect").addEventListener("change", e => {
      buildBasemap3D(e.target.value);
    });

    document.getElementById("exagInput").addEventListener("input", e => {
      elevationExag = Number(e.target.value);
      document.getElementById("exagLabel").textContent = `${elevationExag.toFixed(3)}x`;
      rebuildCloud();
    });

    document.getElementById("sizeInput").addEventListener("input", e => {
      pointSize = Number(e.target.value);
      document.getElementById("sizeLabel").textContent = pointSize.toFixed(2);
      if (cloudPoints) {
        cloudPoints.material.size = pointSize;
      }
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
